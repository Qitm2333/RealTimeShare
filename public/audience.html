<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>现场互动分享 - 观众端</title>
    <link rel="stylesheet" href="/css/audience.css?v=20260909-2" />
  </head>
  <body>
    <main class="audience-app">
      <header class="topbar">
        <div class="brand-block">
          <h1>现场互动</h1>
          <div id="identityChip" class="identity-chip" hidden title="当前浏览器身份" aria-label="当前身份">
            <strong id="nicknameDisplay"></strong>
            <span id="userIdDisplay"></span>
          </div>
          <span id="connectionStatus" class="status">连接中</span>
        </div>
        <a id="downloadButton" class="download-button" href="/document/current.pdf?download=1" download hidden>下载 PDF</a>
      </header>

      <section id="interactionPanel" class="interaction-panel app-view" aria-label="现场互动">
        <div class="interaction-panel-head">
          <strong>现场互动</strong>
        </div>
        <input id="nickname" type="hidden" maxlength="18" value="匿名" />
        <div class="composer">
          <label for="messageInput">弹幕</label>
          <div class="composer-row">
            <textarea id="messageInput" maxlength="80" rows="1" placeholder="发一句现场弹幕"></textarea>
            <button id="sendButton" class="primary-button" type="button">发送</button>
          </div>
        </div>
        <section class="quick-phrase-panel" aria-labelledby="quickPhraseTitle">
          <div class="quick-phrase-head">
            <strong id="quickPhraseTitle">快捷用语</strong>
            <span>点击发送高级弹幕</span>
          </div>
          <div id="quickPhraseGrid" class="quick-phrase-grid" aria-label="快捷用语列表"></div>
        </section>
        <div id="effectGrid" class="effect-grid" aria-label="互动按钮"></div>
      </section>

      <section id="readerPanel" class="reader-panel app-view" aria-label="PDF 阅读" hidden>
        <div id="readerViewport" class="reader-viewport">
          <div id="readerEmpty" class="reader-empty">正在等待演讲者上传 PDF</div>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="页面切换">
        <button id="interactionTab" class="nav-item is-active" type="button" aria-controls="interactionPanel" aria-selected="true">
          互动
        </button>
        <button id="readerTab" class="nav-item" type="button" aria-controls="readerPanel" aria-selected="false">
          阅读
        </button>
      </nav>
    </main>
    <section id="pollDialog" class="poll-dialog" hidden aria-hidden="true" aria-live="polite">
      <div class="poll-panel" role="dialog" aria-modal="true" aria-labelledby="pollQuestion" aria-describedby="pollStatus">
        <strong id="pollQuestion"></strong>
        <div id="pollOptions"></div>
        <p id="pollStatus"></p>
      </div>
    </section>
    <section id="identityDialog" class="identity-dialog" role="dialog" aria-modal="true" aria-hidden="true" hidden aria-labelledby="identityTitle" aria-describedby="identityHint">
      <form id="identityForm" class="identity-panel">
        <h2 id="identityTitle">加入现场互动</h2>
        <p id="identityHint">请输入昵称，之后会自动记住你的身份。</p>
        <label for="identityNickname">昵称</label>
        <input id="identityNickname" maxlength="18" placeholder="例如：小明" autocomplete="nickname" required />
        <div class="identity-actions"><button id="randomNickname" class="secondary-button" type="button">随机昵称</button><button id="identitySubmit" class="primary-button" type="submit">进入互动</button></div>
      </form>
    </section>

    <script src="/js/pdf-reader.js?v=20260909-2"></script>
    <script src="/js/audience.js?v=20260909-2"></script>
  </body>
</html>
