<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>现场互动分享 - 演讲端</title>
    <link rel="stylesheet" href="/css/presenter.css?v=20260910-1" />
  </head>
  <body>
    <main class="stage">
      <section class="pdf-shell" aria-label="PDF 演示内容">
        <div class="pdf-toolbar">
          <div class="pdf-file-actions">
            <label class="file-button" for="pdfInput">上传 PDF</label>
            <input id="pdfInput" class="visually-hidden" type="file" accept="application/pdf,.pdf" />
            <button id="pdfRemove" class="secondary-button danger-button" type="button" disabled>移除文件</button>
            <button id="sessionReset" class="secondary-button reset-button" type="button" title="移除 PDF 并清空本场数据">重置现场</button>
          </div>
          <div id="pdfStatus" class="pdf-status">未打开</div>
          <button id="pollToggle" class="secondary-button" type="button" aria-haspopup="dialog" aria-expanded="false">投票</button>
          <button id="giftToggle" class="gift-toggle is-on" type="button" aria-pressed="true">礼物开</button>
          <div class="audience-mode-panel" aria-label="观众内容模式">
            <span>观众内容</span>
            <button id="audienceModeToggle" type="button" aria-pressed="false">仅互动</button>
          </div>
          <div class="pdf-reader-actions" aria-label="PDF 阅读控制">
            <button id="pdfPrevious" type="button" aria-label="上一页">‹</button>
            <label class="page-jump">
              <input id="pdfPageInput" type="number" min="1" value="1" aria-label="页码" />
              <span>/ <span id="pdfPageCount">0</span></span>
            </label>
            <button id="pdfNext" type="button" aria-label="下一页">›</button>
            <button id="pdfFitWidth" class="fit-button" type="button">适应宽度</button>
            <button id="pdfFitPage" class="fit-button" type="button">整页显示</button>
          </div>
        </div>
        <div id="pdfViewport" class="pdf-viewport">
          <canvas id="pdfCanvas" class="pdf-canvas" hidden></canvas>
          <div id="emptyState" class="empty-state">
            <strong>上传一个 PDF 开始演示</strong>
            <span>当前版本一次只支持一个 PDF 文件</span>
          </div>
        </div>
      </section>

      <div id="danmuLayer" class="danmu-layer" aria-live="polite"></div>
      <div id="effectLayer" class="effect-layer" aria-live="polite"></div>
      <aside class="scoreboard" aria-label="互动统计">
        <div class="score-item gift-score">
          <span class="score-icon">🎁</span>
          <span class="score-label">礼物</span>
          <strong id="giftCount">0</strong>
        </div>
        <div class="score-item top-gift-score">
          <span id="topGiftIcon" class="score-icon">✨</span>
          <span id="topGiftLabel" class="score-label">最高</span>
          <strong id="topGiftCount">0</strong>
        </div>
        <div class="score-item heat-score">
          <span class="score-icon">🔥</span>
          <span class="score-label">热度</span>
          <strong id="heatCount">0</strong>
        </div>
      </aside>
      <div id="comboBadge" class="combo-badge" hidden>互动爆发</div>

      <footer class="presenter-bar">
        <div>
          <span>PDF 演示</span>
          <span id="connectionStatus">连接中</span>
        </div>
        <div id="toast" class="toast">等待观众互动</div>
      </footer>

      <aside id="qrPanel" class="qr-panel" aria-label="观众扫码入场">
        <button id="qrToggle" class="qr-toggle" type="button" aria-expanded="false">扫码入场</button>
        <div id="qrCard" class="qr-card" hidden>
          <div class="qr-card-head">
            <div>
              <p>观众入口</p>
              <strong>扫码加入互动</strong>
            </div>
            <button id="qrClose" class="qr-close" type="button" aria-label="收起二维码">×</button>
          </div>
          <img id="qrImage" class="qr-image" alt="观众入口二维码" />
          <label class="qr-field" for="qrUrlInput">
            <span>入场地址</span>
            <input id="qrUrlInput" type="url" inputmode="url" spellcheck="false" />
          </label>
          <div class="qr-actions">
            <select id="qrUrlSelect" aria-label="自动识别地址"></select>
            <button id="qrSave" type="button">保存</button>
          </div>
          <p id="qrHint" class="qr-hint">自动识别局域网地址；不准时可手动输入。</p>
        </div>
      </aside>

    </main>
    <aside id="pollPanel" class="tools-dialog" hidden aria-hidden="true" aria-label="现场互动工具">
      <div class="tools-scrim" data-tools-close></div>
      <div class="tools-card" role="dialog" aria-modal="true" aria-labelledby="toolsTitle" tabindex="-1">
        <div class="poll-panel-head"><strong id="toolsTitle">现场互动</strong><button id="pollClose" type="button" aria-label="关闭">×</button></div>
        <nav class="tools-tabs" aria-label="互动工具分类">
          <button id="pollTab" class="is-active" type="button" data-tool-tab="poll" aria-controls="pollToolView" aria-selected="true">投票</button>
          <button id="rankingTab" type="button" data-tool-tab="ranking" aria-controls="rankingToolView" aria-selected="false">排名</button>
          <button id="lotteryTab" type="button" data-tool-tab="lottery" aria-controls="lotteryToolView" aria-selected="false">抽奖</button>
        </nav>
        <section id="pollToolView" data-tool-view="poll" aria-labelledby="pollTab">
          <div class="poll-clipboard-actions" aria-label="投票配置导入导出"><button id="pollExport" type="button" title="复制当前投票 JSON 到剪贴板">导出</button><button id="pollImport" type="button" title="从剪贴板读取投票 JSON">粘贴</button></div>
          <div id="pollHome" class="poll-home">
            <div id="pollEmpty" class="poll-empty" hidden>
              <strong>还没有投票内容</strong>
              <span>创建一个投票，让观众参与进来</span>
            </div>
            <div id="pollContentList" class="poll-content-list"></div>
            <div class="poll-home-actions">
              <button id="pollEditButton" type="button" hidden>编辑投票</button>
              <button id="pollCreate" type="button">创建投票</button>
              <button id="pollStartSaved" class="primary-button" type="button" hidden>发起投票</button>
            </div>
          </div>
          <div id="pollEditor" class="poll-editor" hidden>
            <label>问题<input id="pollQuestionInput" maxlength="120" placeholder="输入投票问题" /></label>
            <div class="poll-options-field"><span>选项</span><div id="pollOptionsInput" class="poll-option-list"></div><button id="pollAddOption" class="poll-add-option" type="button">＋ 添加选项</button></div>
            <div class="poll-editor-actions"><button id="pollCancel" type="button">取消</button><button id="pollSave" type="button">保存</button><button id="pollLaunch" class="primary-button" type="button">发起投票</button></div>
          </div>
          <div id="pollLive" class="poll-live" hidden aria-live="polite"></div>
          <div class="poll-result-actions"><button id="pollEnd" class="danger-button" type="button" hidden>结束投票</button><button id="pollClear" type="button" hidden>关闭结果</button></div>
        </section>
        <section id="rankingToolView" data-tool-view="ranking" aria-labelledby="rankingTab" hidden>
          <p class="tool-caption">权重 = 礼物 50% · 弹幕 50%（按本场占比计算）</p>
          <div id="rankingSummary" class="ranking-summary"></div>
          <div id="rankingList" class="ranking-list"><p class="tool-empty">暂无互动数据</p></div>
        </section>
        <section id="lotteryToolView" data-tool-view="lottery" aria-labelledby="lotteryTab" hidden>
          <p class="tool-caption">抽奖权重与排行榜一致，仅演讲端可见。</p>
          <div id="lotterySummary" class="lottery-summary">暂无可抽取用户</div>
          <div class="lottery-controls">
            <div class="lottery-count-field"><span>抽取人数</span><div id="lotteryCountOptions" class="lottery-count-options" role="group" aria-label="抽取人数"><button type="button" data-lottery-count="1" class="is-selected" aria-pressed="true">1 位</button><button type="button" data-lottery-count="2" aria-pressed="false">2 位</button><button type="button" data-lottery-count="3" aria-pressed="false">3 位</button></div></div>
            <button id="lotteryDraw" class="primary-button lottery-draw-button" type="button"><span aria-hidden="true">✦</span><span>开始抽奖</span></button>
          </div>
          <div id="lotteryResult" class="lottery-result" hidden></div>
        </section>
      </div>
    </aside>

    <div id="passwordDialog" class="password-dialog" role="dialog" aria-modal="true">
      <form id="passwordForm" class="password-panel">
        <h1>演讲端</h1>
        <label for="passwordInput">请输入演讲密码</label>
        <div class="password-row">
          <input id="passwordInput" type="password" autocomplete="current-password" autofocus />
          <button type="submit">进入</button>
        </div>
        <p id="passwordError" class="password-error" hidden>密码不正确</p>
      </form>
    </div>

    <script src="/js/pdf-reader.js?v=20260910-1"></script>
    <script src="/js/presenter.js?v=20260910-1"></script>
  </body>
</html>
