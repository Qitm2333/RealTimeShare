<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex 和 ChatGPT 的区别</title>
    <link rel="stylesheet" href="/slides/style.css" />
  </head>
  <body>
    <main class="slide">
      <p class="kicker">01 / Codex 和 ChatGPT 的区别</p>
      <h1>不是换一个入口继续聊天</h1>
      <section class="compare-grid">
        <article>
          <h2>网页版 ChatGPT</h2>
          <p>更适合问答、解释、写作和头脑风暴。</p>
          <ul>
            <li>你把问题讲给它听</li>
            <li>它把答案写给你看</li>
            <li>后面的操作通常还要自己完成</li>
          </ul>
        </article>
        <article>
          <h2>Codex</h2>
          <p>可以进入本地项目，在授权范围内读取资料、修改文件、检查结果。</p>
          <ul>
            <li>它能看 PRD、原型、素材和历史日报</li>
            <li>它能整理文档、生成页面、联动工具</li>
            <li>产物可以直接落在项目文件里</li>
          </ul>
        </article>
      </section>
      <p class="takeaway">Codex 的变化不是更会回答，而是能进入真实项目现场。</p>
    </main>
    <script src="/slides/slide-nav.js"></script>
  </body>
</html>
