<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>从聊天到动手做事</title>
    <link rel="stylesheet" href="/slides/style.css" />
  </head>
  <body>
    <main class="slide">
      <p class="kicker">02 / 从聊天到动手做事</p>
      <h1>让 AI 从聊天变成动手做事</h1>
      <p class="lead">
        先体验 1-6 的完整链路，知道 Codex 怎么把需求变成结果；再了解 Plugin、Skill、MCP 是怎样把这条链路扩展到更多工具和场景。
      </p>
      <section class="workbench-grid" aria-label="Codex 递进式工作方式">
        <div class="workbench-flow">
          <span><b>1</b>听懂需求</span>
          <span><b>2</b>读取材料</span>
          <span><b>3</b>制定步骤</span>
          <span><b>4</b>调用工具</span>
          <span><b>5</b>产出资料</span>
          <span><b>6</b>验证再修</span>
        </div>
        <div class="workbench-modules">
          <div><strong>Plugin</strong><span>把一组能力打包成可调用的工具。</span></div>
          <div><strong>Skill</strong><span>把反复使用的做法沉淀成稳定流程。</span></div>
          <div><strong>MCP</strong><span>把 PS、Figma、知识库等外部工具接入链路。</span></div>
        </div>
      </section>
      <p class="takeaway">不要一开始就陷进概念：先跑完一次真实任务，再回头理解这些扩展词，会更自然。</p>
    </main>
