<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>两个实操案例</title>
    <link rel="stylesheet" href="/slides/style.css" />
  </head>
  <body>
    <main class="slide">
      <p class="kicker">03 / 两个实操案例</p>
      <h1>AI 怎么进入真实项目</h1>
      <p class="lead">
        不只是写代码，也可以先读懂项目现场，再把一个想法快速推到能试用。
      </p>
      <section class="case-grid">
        <div>
          <strong>不止是代码：读文件夹给建议</strong>
          <span>把 PRD、日报、截图和页面文件放在项目里，让 AI 先看现状，再指出信息缺口、体验风险和下一步优化。</span>
        </div>
        <div>
          <strong>Vibe coding 初体验：现场互动系统</strong>
          <span>从“观众扫码发弹幕、送礼物、演讲端实时展示”开始，一边描述想要的效果，一边让 AI 搭出可运行版本。</span>
        </div>
      </section>
      <p class="takeaway">关键变化是：不用先把所有方案想完整，可以边试、边看、边改，让项目自己长出来。</p>
    </main>
    <script src="/slides/slide-nav.js"></script>
  </body>
</html>
