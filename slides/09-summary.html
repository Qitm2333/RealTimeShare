<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>从会说到会做</title>
    <link rel="stylesheet" href="/slides/style.css" />
  </head>
  <body>
    <main class="slide hero">
      <p class="kicker">Closing</p>
      <h1>最后留下两句话</h1>
      <p class="lead">
        AI 是增强人的工具，不是替代人的判断；越会用它，越要保持清醒和边界。
      </p>
      <div class="closing-grid">
        <div>
          <strong>依靠 AI，但不依赖 AI</strong>
          <span>用 AI 武装自己，保持学习、理解原理、训练判断力，让它放大能力，而不是替代思考。</span>
        </div>
        <div>
          <strong>坚守信息安全红线</strong>
          <span>账号、客户资料、内部文档和敏感数据都要守住边界；能不能给 AI 看，先按安全要求判断。</span>
        </div>
      </div>
    </main>
    <script src="/slides/slide-nav.js"></script>
  </body>
</html>
