      <h1>两条安装链路怎么选</h1>
      <section class="install-steps">
        <div><b>1</b><strong>官方省心版</strong><span>准备可登录账号和长期可用手机号；Mac / Windows 正常安装，也可以通过美区 App Store 订阅，让电脑端和手机 App 联动。</span></div>
        <div><b>2</b><strong>省钱但有风险版</strong><span>安装 Codex 后，用 cc switch 管理 DeepSeek 或中转站 API Key。成本低，但要自己承担额度、稳定性、隐私和模型质量风险。</span></div>
      </section>
      <p class="takeaway">选择逻辑很简单：能走官方就走官方；API + cc switch 适合折腾和非敏感任务，不建议直接处理重要资料。</p>
