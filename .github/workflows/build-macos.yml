name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apple-silicon:
    name: Apple Silicon (arm64)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build macOS ZIP
        run: npm run desktop:mac

      - name: Create checksum
        working-directory: release
        run: shasum -a 256 *.zip > SHA256SUMS.txt

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: torras-live-interaction-macos-arm64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: macos-test-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/*.zip \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "macOS Test Build #${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned Apple Silicon test build. See docs/MACOS.md before opening." \
            --prerelease
          RELEASE_URL="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "### macOS test release" >> "$GITHUB_STEP_SUMMARY"
          echo "[$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
